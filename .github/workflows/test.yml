name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck release-index/*.sh

      - name: Run release index tests
        run: release-index/test.sh

      - name: Check download page script syntax
        run: |
          sed -n '/<script>/,/<\/script>/p' release-index/index.html | sed '1d;$d' > page.js
          node --check page.js
